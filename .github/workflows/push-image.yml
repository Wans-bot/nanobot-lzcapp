name: push-image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "image tag (ttl.sh/<name>:24h)"
        default: "ttl.sh/wans-nanobot-0.4.0:24h"
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch upstream
        run: |
          mkdir -p upstream
          curl -fsSL https://codeload.github.com/HKUDS/nanobot/tar.gz/refs/tags/v0.4.0 | tar xz -C upstream --strip-components=1
          test -f upstream/Dockerfile && test -f upstream/entrypoint.sh
      - name: build
        run: docker build -t "${{ inputs.tag }}" upstream
      - name: push
        run: docker push "${{ inputs.tag }}"
