name: test-embed
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g @lazycatcloud/lzc-cli@2.0.9
      - run: |
          mkdir -p content dist img
          cat > img/Dockerfile <<'EOF'
          FROM nginx:alpine
          RUN echo "hello-lpk-embed" > /usr/share/nginx/html/index.html
          EOF
          cat > lzc-build.yml <<'EOF'
          pkgout: dist
          icon: icon.png
          manifest: lzc-manifest.yml
          package: package.yml
          contentdir: content
          images:
            web:
              dockerfile: img/Dockerfile
              context: img
              builder: local
          EOF
          cat > package.yml <<'EOF'
          package: cloud.lazycat.app.embedtest
          version: 0.1.0
          name: EmbedTest
          description: embed test
          author: Wans
          license: MIT
          homepage: https://example.com
          locales:
            zh-CN:
              name: 嵌入测试
              description: 测试内嵌镜像能否安装
              usage: 打开即见
          EOF
          cat > lzc-manifest.yml <<'EOF'
          application:
            subdomain: embedtest
            upstreams:
              - location: /
                backend: http://web:80
          services:
            - name: web
              image: embed:web
          EOF
          printf '\x89PNG\r\n\x1a\n' > icon.png
          docker pull nginx:alpine
          lzc-cli project release -o dist/embedtest.lpk
      - uses: actions/upload-artifact@v4
        with:
          name: t
          path: dist/embedtest.lpk
